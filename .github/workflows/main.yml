name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build APK
      run: |
        cd YTS_4K_Android_GitHub_Project
        chmod +x gradlew || true
        ./gradlew assembleDebug || gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YTS-4K-Movies-App
        path: YTS_4K_Android_GitHub_Project/app/build/outputs/apk/debug/app-debug.apk
